# Feeds test config (Prompt 4). Compact entities + youtube (with known_channels /
# framing_keywords + broad+sweep queries) + podcast_rss + google_news + valid
# stubs for the remaining required top-level keys.

entities:
  - key: atreides
    name: "Atreides Management LLC"
    person: "Gavin Baker"
    cik: "0001777813"
    filing_types: ["13F-HR", "4"]
  - key: situational_awareness
    name: "Situational Awareness LP"
    person: "Leopold Aschenbrenner"
    cik: "0002045724"
    filing_types: ["13F-HR", "4"]

monitor_intervals:
  edgar: 15
  youtube: 120
  podcast_rss: 30
  google_news: 120
  cnbc: 360
  conference_pages: 1440
  website_diff: 1440

youtube:
  queries_by_entity:
    atreides:
      broad_queries: ['"Gavin Baker"']
      sweep_queries:
        - '"Gavin Baker" Atreides'
        - '"Gavin Baker" semiconductors'
    situational_awareness:
      broad_queries: ['"Leopold Aschenbrenner"']
      sweep_queries:
        - '"Situational Awareness" AGI'
  max_results_per_query: 5
  master_manifest_path: "reference/master_manifest_v2.json"
  known_channels:
    - "All-In Podcast"
    - "Bg2 Pod"
  framing_keywords:
    - "interview"
    - "podcast"

podcast_rss:
  feeds:
    - show: "Invest Like the Best"
      url: "https://example.com/iltb.rss"
      keywords: ["Baker", "Atreides"]
    - show: "All-In Podcast"
      url: ""
      keywords: ["Baker"]
    - show: "Dwarkesh Podcast"
      url: "https://example.com/dwarkesh.rss"
      keywords: ["Leopold", "Aschenbrenner"]
    - show: "Generic Markets"
      url: "https://example.com/generic.rss"
      keywords: ["Nvidia"]

google_news:
  queries:
    - '"Gavin Baker" interview'
    - '"Leopold Aschenbrenner" AGI'

cnbc:
  queries: ["Gavin Baker", "Leopold Aschenbrenner"]

conference_pages:
  - key: bic_speakers
    conference: "Boston Investment Conference"
    url: "https://bostoninvestmentconference.com/speakers"
    season_months: [9, 10, 11]
    keywords: ["Baker"]

website_diff:
  - key: gavinbaker_net
    url: "https://gavinbaker.net"
    keywords: []
    check_rss: false

alert_routing:
  filing_13f:        ["email", "sms"]
  filing_sc13:       ["email", "sms"]
  filing_form4:      ["email"]
  filing_other:      ["email"]
  youtube_high:      ["email", "sms"]
  youtube_medium:    ["email"]
  podcast_rss:       ["email", "sms"]
  google_news:       ["email"]
  cnbc_video:        ["email", "sms"]
  conference_change: ["email"]
  leopold_post:      ["email", "sms"]
  website_diff:      ["email"]

alert_recipients:
  email_env: "ALERT_EMAIL"
  phone_env: "ALERT_PHONE"

paths:
  state_dir: "state"
  reference_dir: "reference"
