name: FOMO Fund Monitor Heartbeat

# Weekly proof-of-life. Without it, "no alerts this week" is indistinguishable
# from "the alerting layer has been dead since August" -- which is exactly what
# happened for 25 days.
#
# Monday 13:00 UTC (~09:00 ET), before the US open, so a broken monitor is
# noticed at the start of the week rather than the end.
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

permissions:
  # contents:write is needed to push the DRAINED digest queue back. Without it
  # the heartbeat would clear state/digest_queue.json locally, the change would
  # be discarded with the runner, and every heartbeat would re-send the same
  # items forever.
  # actions:read lets the heartbeat query the monitoring workflow's run history
  # for an exact executed/failed count. Without it the report silently falls
  # back to counting state commits, which cannot see failed runs.
  contents: write
  actions: read

concurrency:
  group: fomo-fund-monitor-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # REQUIRED. The heartbeat counts state commits and diffs state files
          # against a baseline commit up to 7 days old; the default shallow
          # clone (depth 1) would report one run and zero alerts every week.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send heartbeat
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          # Provided automatically by Actions; enables the exact run/failure
          # counts. GITHUB_REPOSITORY is set by the runner.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # No `continue-on-error`: a heartbeat that cannot send is itself the
        # alarm, and must fail the job so GitHub notifies.
        run: python heartbeat.py

      - name: Commit the drained digest queue
        # Only reached when the send succeeded (heartbeat.py drains AFTER the
        # mail is away), so a failed send leaves the queue intact for next week.
        if: success()
        run: |
          git config user.name "fomo-monitor-bot"
          git config user.email "fomo-monitor@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Drain digest queue $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The monitor cron pushes state too; rebase before pushing.
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push
