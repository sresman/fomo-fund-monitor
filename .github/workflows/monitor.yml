name: FOMO Fund Monitor

# Cron fires every 30 minutes; main.py gates each monitor by its own interval
# (last_run.json) so we stay within API quotas while running EDGAR frequently.
#
# Was */15 until 2026-09-03. Two reasons for halving it, ahead of the repo going
# private:
#   1. It bought nothing. GitHub throttles high-frequency schedules hard --
#      measured 2026-08-27..09-03, actual delivery was 2-7 runs/day against a
#      declared 96, an effective gap of ~4 hours. EDGAR's own interval gate is
#      15 minutes and never came close to binding.
#   2. Private repos bill Actions minutes against the account quota (public ones
#      do not). If going private restores anything near the declared cadence,
#      */15 is ~2,880 min/month, which exceeds a Free plan and nearly exhausts
#      Team. */30 halves the ceiling.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

# The job commits updated state files back to the repo.
permissions:
  contents: write

# Never run two passes concurrently (state-file races), but never cancel a
# run mid-flight either -- a cancelled run could leave partially-committed state.
concurrency:
  group: fomo-fund-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync latest state (avoid stale-checkout races)
        # A prior run may have pushed newer state after this run's checkout was
        # scheduled; rebase our (empty) working tree onto it before running so
        # we read the freshest last_run.json / seen_*.json.
        run: git pull --rebase --autostash origin "$GITHUB_REF_NAME"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitors
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_AUTH: ${{ secrets.TWILIO_AUTH }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          ALERT_PHONE: ${{ secrets.ALERT_PHONE }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          # Optional: only needed once dispatch_bridge.enabled = true in config.yaml.
          DISPATCH_GITHUB_PAT: ${{ secrets.DISPATCH_GITHUB_PAT }}
        run: python main.py

      - name: Commit state updates
        # NOT `success()`. main.py now exits non-zero when any alert fails to
        # deliver, but events that DID deliver have already had their dedupe
        # state written -- dropping that write would re-alert them on the next
        # run. `!cancelled()` still skips a cancelled run, whose state could be
        # half-written (see the concurrency comment above), and is a no-op when
        # an earlier step failed before main.py touched state (the diff guard
        # below exits 0).
        if: ${{ !cancelled() }}
        run: |
          git config user.name "fomo-monitor-bot"
          git config user.email "fomo-monitor@users.noreply.github.com"
          git add state/
          # Nothing changed => no commit, no push (clean no-op run).
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update monitor state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Re-sync in case a concurrent run pushed between our run and now, then push.
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push
