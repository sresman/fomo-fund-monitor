# config.yaml — all user-tunable configuration. NO SECRETS (those come from env).

entities:
  - key: atreides                       # stable internal id; used as state-file key
    name: "Atreides Management LLC"
    person: "Gavin Baker"
    cik: "0001777813"                   # 10-digit zero-padded
    filing_types: ["13F-HR", "13F-HR/A", "SC 13D", "SC 13D/A", "SC 13G", "SC 13G/A", "4", "NPORT-P"]
  - key: situational_awareness
    name: "Situational Awareness LP"
    person: "Leopold Aschenbrenner"
    cik: "0002045724"
    filing_types: ["13F-HR", "13F-HR/A", "SC 13D", "SC 13D/A", "SC 13G", "SC 13G/A", "4"]

# Minutes between runs per monitor (interval gating consults last_run.json).
# EVERY monitor name in constants.MONITOR_NAMES must be present here — exact set (fail fast on
# any missing OR unknown key).
monitor_intervals:
  edgar: 15
  youtube: 120
  podcast_rss: 30
  google_news: 120
  cnbc: 360
  conference_pages: 1440
  website_diff: 1440

# ---- Monitor config slots (Prompts 3–5 consume these) ----

youtube:
  # Broad queries run every interval; sweep queries run once/day (Prompt 4 logic).
  # Keyed by entity.key. Every key here MUST match a defined entities[].key (else ConfigError).
  queries_by_entity:
    atreides:                            # was "baker" in the spec's example
      broad_queries: ['"Gavin Baker"']
      sweep_queries:
        - '"Gavin Baker" Atreides'
        - '"Gavin Baker" semiconductors OR AI'
        - '"Atreides Management" interview OR podcast'
    situational_awareness:               # was "leopold" in the spec's example
      broad_queries: ['"Leopold Aschenbrenner"']
      sweep_queries:
        - '"Leopold Aschenbrenner" Situational Awareness'
        - '"Situational Awareness" AI OR AGI'
  max_results_per_query: 5               # must be > 0
  master_manifest_path: "reference/master_manifest_v2.json"  # dedupe source (Prompt 4)
  known_channels:                        # channel titles trusted as podcast/media (confidence HIGH input)
    - "All-In Podcast"
    - "Invest Like the Best"
    - "Bg2 Pod"
    - "This Week in Startups"
    - "Dwarkesh Patel"
    - "Lex Fridman"
    - "CNBC Television"
    - "Bloomberg Television"
    - "a16z"
    - "Capital Allocators with Ted Seides"
    - "iConnections"
    - "Sohn Conference Foundation"
    - "Heller House"
    - "Generating Alpha Podcast"
    - "The Limitless Podcast"
    - "TBPN"
    - "Aleph"
  framing_keywords:                      # interview/guest framing tokens (lowercased match)
    - "interview"
    - "podcast"
    - "conversation"
    - "sits down"
    - "joins"
    - "in conversation"
    - "on the show"
    - "ep."
    - "episode"

# Keywords are FULL NAMES, not surnames (changed 2026-09-03). An audit of every
# configured feed found 22 historical surname matches and ZERO of them genuine:
# "Gavin Newsom" (x7), "Theo Baker", "Hobey Baker", "bakeries", "bakerlaw.com",
# "emilybakerwhite", and Gavin's own @GavinSBaker handle appearing in show-notes
# link dumps. matches_keywords now also strips URLs and matches whole tokens, so
# a surname would still over-match on unrelated people -- full names are what
# make the surface precise. "Atreides" stays as a distinctive single token.
