# config.yaml — all user-tunable configuration. NO SECRETS (those come from env).

entities:
  - key: atreides                       # stable internal id; used as state-file key
    name: "Atreides Management LLC"
    person: "Gavin Baker"
    cik: "0001777813"                   # 10-digit zero-padded
    filing_types: ["13F-HR", "13F-HR/A", "SC 13D", "SC 13D/A", "SC 13G", "SC 13G/A", "4", "NPORT-P"]
  - key: situational_awareness
    name: "Situational Awareness LP"
    person: "Leopold Aschenbrenner"
    cik: "0002045724"
    filing_types: ["13F-HR", "13F-HR/A", "SC 13D", "SC 13D/A", "SC 13G", "SC 13G/A", "4"]

# Minutes between runs per monitor (interval gating consults last_run.json).
# EVERY monitor name in constants.MONITOR_NAMES must be present here — exact set (fail fast on
# any missing OR unknown key).
monitor_intervals:
  edgar: 15
  youtube: 120
  podcast_rss: 30
  google_news: 120
  cnbc: 360
  conference_pages: 1440
  website_diff: 1440

# ---- Monitor config slots (Prompts 3–5 consume these) ----

youtube:
  # Broad queries run every interval; sweep queries run once/day (Prompt 4 logic).
  # Keyed by entity.key. Every key here MUST match a defined entities[].key (else ConfigError).
  queries_by_entity:
    atreides:                            # was "baker" in the spec's example
      broad_queries: ['"Gavin Baker"']
      sweep_queries:
        - '"Gavin Baker" Atreides'
        - '"Gavin Baker" semiconductors OR AI'
        - '"Atreides Management" interview OR podcast'
    situational_awareness:               # was "leopold" in the spec's example
      broad_queries: ['"Leopold Aschenbrenner"']
      sweep_queries:
        - '"Leopold Aschenbrenner" Situational Awareness'
        - '"Situational Awareness" AI OR AGI'
  max_results_per_query: 5               # must be > 0
  master_manifest_path: "reference/master_manifest_v2.json"  # dedupe source (Prompt 4)
  known_channels:                        # channel titles trusted as podcast/media (confidence HIGH input)
    - "All-In Podcast"
    - "Invest Like the Best"
    - "Bg2 Pod"
    - "This Week in Startups"
    - "Dwarkesh Patel"
    - "Lex Fridman"
    - "CNBC Television"
    - "Bloomberg Television"
    - "a16z"
    - "Capital Allocators with Ted Seides"
    - "iConnections"
    - "Sohn Conference Foundation"
    - "Heller House"
    - "Generating Alpha Podcast"
    - "The Limitless Podcast"
    - "TBPN"
    - "Aleph"
  # NOTE (2026-09-03): framing_keywords NO LONGER promotes a video to HIGH.
  # A title is written by whoever uploaded it, so a third-party channel could
  # call its 90-second cut "Gavin Baker interview" and inherit HIGH confidence --
  # which is how a Chinese-language recap and two ~100-second clips reached the
  # inbox. HIGH now requires known_channels membership (first-party publisher).
  # The list is retained: it is still validated by the loader and is the natural
  # place to tune from if a second signal is ever wanted.
  framing_keywords:                      # interview/guest framing tokens (currently unused for routing)
    - "interview"
    - "podcast"
    - "conversation"
    - "sits down"
    - "joins"
    - "in conversation"
    - "on the show"
    - "ep."
    - "episode"

# Keywords are FULL NAMES, not surnames (changed 2026-09-03). An audit of every
# configured feed found 22 historical surname matches and ZERO of them genuine:
# "Gavin Newsom" (x7), "Theo Baker", "Hobey Baker", "bakeries", "bakerlaw.com",
# "emilybakerwhite", and Gavin's own @GavinSBaker handle appearing in show-notes
# link dumps. matches_keywords now also strips URLs and matches whole tokens, so
# a surname would still over-match on unrelated people -- full names are what
# make the surface precise. "Atreides" stays as a distinctive single token.
podcast_rss:
  feeds:
    - show: "Invest Like the Best"
      url: "https://feeds.megaphone.fm/investlikethebest"
      keywords: ["Gavin Baker", "Atreides"]
    - show: "All-In Podcast"
      url: "https://allinchamathjason.libsyn.com/rss"
      keywords: ["Gavin Baker"]
    - show: "This Week in Startups"
      url: "https://anchor.fm/s/7c624c84/podcast/rss"
      keywords: ["Gavin Baker"]
    - show: "Capital Allocators"
      url: "https://tedseides.libsyn.com/rss"
      keywords: ["Gavin Baker", "Atreides"]
    - show: "a16z Podcast"
      url: "https://feeds.simplecast.com/JGE3yC0V"
      keywords: ["Gavin Baker"]
    - show: "BG2 Pod"
      url: "https://anchor.fm/s/f06c2370/podcast/rss"
      keywords: ["Gavin Baker"]
    - show: "Bankless / Limitless"
      url: "http://feeds.libsyn.com/247424/rss"
      keywords: ["Gavin Baker"]
    - show: "TBPN"
      url: "https://feeds.transistor.fm/technology-brother"
      keywords: ["Gavin Baker"]
    - show: "Generating Alpha"
      url: "https://anchor.fm/s/e79435d0/podcast/rss"
      keywords: ["Gavin Baker"]
    - show: "Invested by Aleph"
      url: "https://feeds.megaphone.fm/AMCL3368122371"
      keywords: ["Gavin Baker", "Atreides"]
    - show: "Dwarkesh Podcast"
      # Was api.substack.com/feed/podcast/69345.rss, which 403s from GitHub
      # Actions runner IPs (verified 2026-09-03: HTTP 200 from a laptop, HTTP
      # 403 from the runner, identical User-Agent -- an IP block, not a UA
      # block). It failed on EVERY run since 2026-08-09 and never seeded.
      #
      # TRADE-OFF: this custom-domain feed serves only a 20-item window, where
      # the api feed served 139. Historical coverage is lost -- the June 2024
      # "Leopold Aschenbrenner - 2027 AGI" episode is NOT in the window. Future
      # episodes are what matters and they will be caught. The two feeds share
      # ZERO guids (UUIDs vs post URLs), so configuring both would double-alert
      # every new episode; this replaces rather than adds.
      url: "https://www.dwarkesh.com/feed"
      keywords: ["Leopold Aschenbrenner"]
    - show: "Lex Fridman"
      # Was url: "" -- and an empty url is SKIPPED outright by check_podcast_rss
      # ("empty-url feeds get NO seed key"), so this entry monitored nothing at
      # all since the repo was built. Filled in 2026-09-03 with the verified
      # feed (HTTP 200, 502 items). Leopold has never appeared on it -- 0
      # first-party matches across the full archive -- so this buys future
      # coverage, not backfill.
      url: "https://lexfridman.com/feed/podcast/"
      keywords: ["Leopold Aschenbrenner"]

google_news:
  queries:
    - '"Gavin Baker" interview OR podcast OR conference OR panel'
    - '"Gavin Baker" Atreides'
    - '"Leopold Aschenbrenner" interview OR podcast OR AI'
    - '"Situational Awareness" Aschenbrenner'

cnbc:
  queries: ["Gavin Baker", "Leopold Aschenbrenner"]

conference_pages:
  - key: bic_speakers
    conference: "Boston Investment Conference"
    url: "https://bostoninvestmentconference.com/speakers"
    season_months: [9, 10, 11]
    keywords: ["Gavin Baker", "Leopold Aschenbrenner"]
  - key: iconnections_speakers
    conference: "iConnections Global Alts"
    url: "https://iconnections.io"
    season_months: [11, 12, 1, 2]
    keywords: ["Gavin Baker", "Leopold Aschenbrenner"]
  - key: sohn_ny_speakers
    conference: "Sohn Conference (NY)"
    url: "https://sohnconference.org"
    season_months: [3, 4, 5]
    keywords: ["Gavin Baker", "Leopold Aschenbrenner"]
  - key: sohn_montreal_speakers
    conference: "Sohn Montreal"
    url: "https://sohnmontreal.org"
    season_months: [3, 4, 5, 6]
    keywords: ["Gavin Baker", "Leopold Aschenbrenner"]
  - key: sohn_heartsandminds_speakers
    conference: "Sohn Hearts & Minds (Australia)"
    url: "https://sohnheartsandminds.com.au"
    season_months: [9, 10, 11, 12]
    keywords: ["Gavin Baker", "Leopold Aschenbrenner"]
  - key: fii_speakers
    conference: "FII Institute / Priority"
    url: "https://fii-institute.org"
    season_months: []               # year-round; empty == always in-season
    keywords: ["Gavin Baker", "Leopold Aschenbrenner"]

website_diff:
  - key: gavinbaker_net
    url: "https://gavinbaker.net"
    keywords: []                    # any change of interest; empty == alert on any diff
    check_rss: false
  - key: situational_awareness_com
    url: "https://situational-awareness.com"
    keywords: []
    check_rss: true                 # Substack-style /feed (Prompt 5 logic)

# ---- Alert routing matrix (Prompt 2 consumes) ----
# Keys are EventType values (parsed into EventType members by the loader).
# MUST cover EXACTLY every EventType member — missing OR unknown key => ConfigError.
# Each maps to the channels to fire (validated against AlertChannel).
#
# AN EMPTY LIST IS A SILENT CAPTURE, NOT A MISTAKE. The monitor still runs, still
# detects, and still commits dedupe state so the data accrues for later analysis —
# it just never reaches an inbox. See alerting/dispatch.py and main.alert_delivered.
#
# POLICY (operator, 2026-09-03): the alert set is FIRST-PARTY APPEARANCES by
# Gavin Baker or Leopold Aschenbrenner, plus SEC filings for the two tracked
# entities. Everything else — news commentary, third-party clips, recaps,
# reaction videos — is captured silently.
#
# SMS is unrouted everywhere; the Twilio secrets are unset by decision.
alert_routing:
  # --- SEC filings: always alert. Low volume, highest signal. ---
  filing_13f:        ["email"]   # 13F-HR / 13F-HR/A
  filing_sc13:       ["email"]   # SC 13D / 13G and amendments
  filing_form4:      ["email"]   # insider transactions for a tracked entity
  filing_other:      []          # SILENT: unmapped/other forms, no defined signal

  # --- First-party appearances: alert. ---
  youtube_high:      ["email"]   # HIGH now requires a KNOWN publisher channel
  podcast_rss:       ["email"]   # gated to first-party appearances in the monitor
  cnbc_video:        ["email"]   # a CNBC hit IS the person on camera
  leopold_post:      ["email"]   # Leopold writing on situational-awareness.com
  conference_change: ["email"]   # a speaker page naming him = an upcoming appearance

  # --- Derivative / commentary: capture, never alert. ---
  youtube_medium:    []          # SILENT: unknown channel => clip, recap, reaction
  google_news:       []          # SILENT: ~92% of volume, commentary not events
  website_diff:      []          # SILENT: any-diff page hash, no first-party signal

# ---- Alert recipient references (env var NAMES, not values) ----
# The loader stores the env-var name; the alerter (Prompt 2) resolves via os.environ.
# NOTE: the loader does NOT check the env var exists (that's a Prompt 2/6 runtime concern),
# but it DOES reject an empty env-var name string.
alert_recipients:
  email_env: "ALERT_EMAIL"
  phone_env: "ALERT_PHONE"

# ---- Filesystem paths (resolved relative to THIS config file's directory = repo root) ----
paths:
  state_dir: "state"
  reference_dir: "reference"

# ---- repository_dispatch bridge to the celeb-pm repo (Prompt 6) ----
# Optional. When enabled, each COMMITTED event fires a repository_dispatch to the
# target repo. The PAT is resolved from env (DISPATCH_GITHUB_PAT) AT CALL TIME;
# if absent, the bridge is skipped with a single INFO log (never breaks the run).
# `repo` is ONLY validated as owner/name when enabled: true.
dispatch_bridge:
  enabled: false                     # default off; flip to true once the PAT + receiver exist
  repo: "collectifadv/celeb-pm"      # owner/name of the receiving repo (PLACEHOLDER — operator fills)
  event_type: "fomo_monitor_event"   # optional; defaults to DEFAULT_DISPATCH_EVENT_TYPE if omitted
